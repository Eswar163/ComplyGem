<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ComplyGeM — AI-Powered Bid Compliance</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="mark" id="brand-mark"></div>
        <div>
          <div class="name">COMPLY<b>GeM</b></div>
          <div class="tag">AI-Powered Bid Compliance</div>
        </div>
      </div>
      <div class="side-scroll">
        <div class="nav-section">Workspace</div>
        <nav class="nav" id="nav-main">
          <a href="#/" data-nav="overview"><span class="ic" data-ic="grid"></span><span class="txt">Overview</span></a>
          <a href="#/tenders" data-nav="tenders"><span class="ic" data-ic="tender"></span><span class="txt">Tenders</span><span class="count" id="nav-tender-count"></span></a>
          <a href="#/bids" data-nav="bids"><span class="ic" data-ic="bids"></span><span class="txt">Bids</span><span class="count" id="nav-bid-count"></span></a>
          <a href="#/documents" data-nav="documents"><span class="ic" data-ic="files"></span><span class="txt">Documents</span></a>
        </nav>
        <div class="nav-section">System</div>
        <nav class="nav" id="nav-system">
          <a href="#/verification" data-nav="verification"><span class="ic" data-ic="shield"></span><span class="txt">Verification</span></a>
          <a href="#/reports" data-nav="reports"><span class="ic" data-ic="report"></span><span class="txt">Reports</span></a>
          <a href="#/audit" data-nav="audit"><span class="ic" data-ic="audit"></span><span class="txt">Audit Trail</span></a>
        </nav>
        <div class="nav-section">Analysis</div>
        <nav class="nav">
          <a href="#/new" data-nav="new"><span class="ic" data-ic="plus"></span><span class="txt">New Analysis</span></a>
        </nav>
      </div>
      <div class="side-foot">
        <div class="sys-status"><span class="pulse"></span> All systems operational</div>
        <div class="side-user">
          <div class="avatar">PO</div>
          <div class="who">
            <b>Procurement Officer</b>
            <span>GeM Desk · India</span>
          </div>
        </div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="crumb" id="crumb"></div>
        <div class="top-search">
          <span data-ic="search"></span>
          <input type="text" id="global-search" placeholder="Search tenders…" autocomplete="off" />
          <div class="search-pop" id="search-pop"></div>
        </div>
        <div style="position:relative">
          <button class="icon-btn" id="notif-btn" title="Notifications" aria-label="Notifications"><span data-ic="bell"></span><span class="badge hidden" id="notif-badge"></span></button>
          <div class="notif-pop" id="notif-pop"></div>
        </div>
        <div class="top-user">
          <div class="who" style="text-align:right"><b>Procurement Officer</b><span>GeM Desk</span></div>
          <div class="avatar">PO</div>
        </div>
      </header>
      <main class="content" id="view"></main>
    </div>
  </div>

  <div class="overlay" id="process-overlay"><div class="process-card" id="process-card"></div></div>
  <div class="modal" id="ev-modal"><div class="modal-card" id="ev-modal-card"></div></div>
  <div class="toasts" id="toasts"></div>

  <script src="/app.js"></script>
</body>
</html>
